<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flexbox Layout Assignment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>Header</h1>
    </header>

    <nav class="nav">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Gallery</a></li>

      </ul>

    <!-- flexbox -->
    <div class="content-row">

        <h2>Content</h2>

      </aside>

    <footer class="footer">
      <p>Footer</p>
    </footer>
  </div>
