<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        body {
            font-family: Arial, sasn-serif;
            line-height: 1.5;
            padding: 20px;
            background-color: white;
        }

        form {
            max-width: 700px;
            margin: auto;
            padding: 20px;
            background: #FFFFFF;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        div {
            margin-bottom: 15px;
        }

        .fieldsetContainer {
            display: flex;
            align-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        fieldset {
            flex: 1 1 300px;
        }

        .lable {
            margin-bottom: 2px;
            font-weight: bold;
        }


        input[type="text"] 
        input[type="email"]
        {
            border: 1px solid #cccccc;
            border-radius: 5px;
            width: 100%;
        }

    </style>
</head>
<body>
    <form method="post" action="formProcess.php">
        <div>
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" value="">
        </div>
        
        <div>
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" value="">
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" value="">
        </div>

        <div>
            <label for="topic">Topic:</label>
            <select name="topic">
            <option value="">-- Select One --</option>
            <option value="wds">Web Development Service</option>
            <option value="wdds">Web Design Services</option>
            <option value="ss">Support Services</option>
            </select>
        </div>

         <div class="fieldsetContainer">
            <fieldset>
            <legend>Computer OS</legend>
            <label for="windows">Windows:</label>
            <input type="radio" id="windows" name="computer_os" value="widows">
             
            <label for="mac">Mac OS:</label>
            <input type="radio" id="macos" name="computer_os" value="macos">

            <label for="linux">Linux:</label>
            <input type="radio" id="linux" name="computer_os" value="linux">
            </fieldset>
        </div>
        <div>
            <fieldset>
            <legend>Application</legend>
            <label for="photoshop">Photoshop:</label>
            <input type="checkbox" id="photoshop" name="application" value="photoshop">

            <label for="figma">Figma:</label>
            <input type="checkbox" id="figma" name="application" value="figma">
            </fieldset>

            <label for="message">Message</label>
            <textarea type="message">Message</textarea>

            <button type="submit">
                Submit
            </button>
        </div>
    </form>
</body>
</html>
