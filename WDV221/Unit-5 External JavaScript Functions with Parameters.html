<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WDV221 Event Handlers</title>
    <style>
        body { background-color: #eeddda; padding: 20px; font-family: sans-serif; }
        .box { width: 250px; padding: 20px; background: #096; color: white; text-align: center; cursor: pointer; border-radius: 8px; margin-top: 10px; }
        .highlight { border: 2px solid #d9534f; background-color: #fff; }
    </style>

    <script>
            // 1
            function pageLoaded() {
            alert("Page has loaded!");
            }

            function mouseIn() {
            var box = document.getElementById("mouseBox");
            box.style.backgroundColor = "#FC6";
            box.innerHTML = "Mouse is OVER!";
            }

            function mouseOut() {
            var box = document.getElementById("mouseBox");
            box.style.backgroundColor = "#096";
            box.innerHTML = "Mouse is OUT!";
            }

            // 2
            mouseBox.ondblclick = function() {
                displayAlert("Double Clicked!");
            }

            // 3
            function keyAction() {
            var inputVal = element.value; 
            alert("Type: " + inputVal);
            }

    </script>
</head>

<body>
    <h1>WDV221 Event Handlers</h1>
    <hr />

    <h3>1. Mouse Events</h3>
    <input type="button" id="btnClick" value="Click Me" />
    <div id="mouseBox" class="box">Hover or Double Click me!</div>

    <h3>2. Form Events</h3>
    <form onsubmit="return handleSubmit()">
        <p>Change event: 
            <select id="selectBox" onchange="handleChange()">
                <option value="Normal">Normal</option>
                <option value="Advanced">Advanced</option>
            </select>
        </p>
        <input type="submit" value="Submit Form" />
    </form>

    <h3>3. Console Events</h3>
    <p>Type something: 
        <input type="text" id="keyInput" />
    </p>

</body>
</html>
