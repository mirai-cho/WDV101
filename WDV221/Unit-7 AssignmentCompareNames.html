<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WDV221 Intro Javascript</title>
<script>


	function compareNames() {

		let name1 = document.getElementById("value1").value;
		let name2 = document.getElementById("value2").value;
		let resultSpan = document.getElementById("displayResult");

		if (name1 === "" || name2 === "") {
			resultSpan.innerHTML = "Please enter both names.";
			return;
		}

		if (name1.toLowerCase() === name2.toLowerCase()) {
			resultSpan.innerHTML = "Same";
		} else {
			resultSpan.innerHTML = "Different";
		}
	}

	function resetForm() {
		document.getElementById("displayResult").innerHTML = "";
	}
</script>
</head>

<body>
<h2>WDV221 Intro Javascript</h2>
<h3>Unit -7 Comparison and IF Statements - Compare Names Assignment </h3>
<hr />
<p>Please complete the following exercises on this page. When complete post this page to your server. Make a link in your WDV221 homework page for this assignment. </p>
<hr />

<form id="form1" name="form1" method="post" action="" onsubmit="compareNames(); return false;">
  <p>Name 1: 
    <input type="text" name="value1" id="value1" />
  </p>
  <p>Name 2: 
    <input type="text" name="value2" id="value2" />
  </p>
  
  <p>Result: <span id="displayResult" style="font-weight:bold;"></span></p>
  
  <p><input type="submit" value="Compare Names" />
  </p>
  <p>
    <input type="reset" name="Reset" id="button" value="Reset" onclick="resetForm()" />
  </p>
</form>

</body>
</html>
